[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banshee"
version = "0.1.0"
description = "MAD recon pipeline wrapper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.scripts]
banshee = "banshee_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
